packages:
  - "apps/*"
  - "packages/*"

# Expo/React Native geçişli bağımlılıkları düz node_modules'ta görmek ister.
nodeLinker: hoisted

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
  sharp: true
  '@img/sharp-linux-x64': true
