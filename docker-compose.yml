services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      # Üretimde HTTPS arkasında bu satırı kaldırın (secure cookie aktif olsun).
      INSECURE_COOKIES: ${INSECURE_COOKIES:-}
    volumes:
      # SQLite verisini kalıcı tut (kapsayıcı yeniden başlasa da kaybolmaz)
      - dugun38-data:/app/packages/db/prisma
    restart: unless-stopped

volumes:
  dugun38-data:
